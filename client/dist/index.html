<!DOCTYPE html>
<html lang="en">
  <head>

    <title>Timetable Management System - Admin Dashboard</title>
    <style>
      html,
      body,
      #app {
        min-height: 100%;
      }

      body {
        margin: 0;
        background: #f0f2f5;
      }

      #first-paint-loader {
        position: fixed;
        inset: 0;
        z-index: 2147483002;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: #f0f2f5;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      }

      .first-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        color: #1c1e21;
        text-align: center;
      }

      .first-loader-logo-wrap {
        position: relative;
        width: 104px;
        height: 104px;
        display: grid;
        place-items: center;
      }

      .first-loader-logo-wrap::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 3px solid #d8dadf;
        border-top-color: #1877f2;
        animation: first-loader-spin 0.95s linear infinite;
      }

      .first-loader-logo {
        position: relative;
        z-index: 1;
        width: 76px;
        height: 76px;
        -o-object-fit: contain;
           object-fit: contain;
        filter: drop-shadow(0 10px 18px rgba(24, 119, 242, 0.18));
      }

      .first-loader-title {
        color: #1877f2;
        font-size: clamp(1.55rem, 6vw, 2rem);
        font-weight: 800;
        letter-spacing: 0;
      }

      .first-loader-detail {
        color: #65676b;
        font-size: 0.95rem;
        font-weight: 600;
      }

      .first-loader-footer {
        position: absolute;
        left: 24px;
        right: 24px;
        bottom: 34px;
        display: grid;
        gap: 4px;
        color: #8a8d91;
        font-size: 0.78rem;
        text-align: center;
      }

      .first-loader-footer strong {
        color: #1877f2;
        font-size: 0.88rem;
        font-weight: 800;
      }

      @keyframes first-loader-spin {
        to { transform: rotate(360deg); }
      }

          <img class="first-loader-logo" src="/title-logo.png" alt="Timetable logo" />
        </div>
        <div>
          <div class="first-loader-title">Timetable</div>
          <div class="first-loader-detail">Loading</div>

      </div>
      <div class="first-loader-footer" aria-hidden="true">
